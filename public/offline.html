<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1c1c1a" />
  <title>Offline | Salon A - Line</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #2b2924;
      background: #f6f4ef;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid #e5e0d6;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 50px rgb(43 41 36 / 10%);
      text-align: center;
    }

    img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0;
      color: #78716c;
      line-height: 1.6;
    }

    button {
      min-height: 44px;
      margin-top: 24px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #2b2924;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <img src="/pwa-icon-192.png" alt="Salon" />
    <h1>You’re offline</h1>
    <p>Reconnect to manage appointments, sign in, or make a booking. Previously loaded application screens may still be
      available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>

</html>
